<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOIR CORTEGE — AI Music Crew</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0b0b0b; 
            color: #f5f5f5; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
            text-align: center;
            overflow-y: auto; 
            overflow-x: hidden;
            position: relative;
        }

        /* Шапка-баннер */
        .full-width-banner {
            width: 100%;
            height: 45vh; 
            background-image: url('media/img/banner.jpg'); 
            background-size: cover;
            background-position: top center;
            border-bottom: 1px solid #1a1a1a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: block; /* Гарантирует отображение элемента */
        }

        /* Главная трехколоночная сетка */
        .main-layout {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 10px; /* Отступ 10px между видео и информацией */
            width: 100%;
            margin-top: 10px; /* Отступ 10px от баннера сверху */
            padding: 0 10px 20px 10px; /* Отступы 10px от краев экрана (слева и справа) */
        }

        /* Резиновая центральная карточка */
        .container {
            flex: 1; /* Карточка гибко сжимается и расширяется */
            max-width: 650px; 
            min-width: 280px; /* Защита от слишком сильного сжатия */
            border: 1px solid #222;
            padding: 60px 20px; 
            background: rgba(17, 17, 17, 0.95);
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border-radius: 4px;
        }
        h1 { 
            font-size: 2.5rem; 
            letter-spacing: 6px; 
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .subtitle { 
            font-size: 1rem; 
            line-height: 1.7;
            color: #777;
            margin-bottom: 45px;
        }
        
        /* Кнопки соцсетей */
        .links-title {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-width: 140px; 
            padding: 14px 15px; 
            border: 1px solid #333;
            color: #aaa;
            text-decoration: none;
            font-size: 0.9rem; 
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        .social-btn:hover {
            border-color: #fff;
            color: #fff;
            background: #1a1a1a;
        }

        /* Боковые видео */
        .video-background {
            width: 360px; 
            height: 640px; 
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            opacity: 0.4;
            transition: opacity 0.3s ease;
            flex-shrink: 0; 
        }
        .video-background:hover {
            opacity: 0.7;
        }

        .video-background iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Адаптивность: скрываем видео на экранах меньше 1100px, чтобы не зажимать карточку */
        @media (max-width: 1100px) {
            .video-background {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- 1. Баннер 45vh -->
    <div class="full-width-banner"></div>

    <!-- 2. Главная область (Сетка с отступами по 10px) -->
    <div class="main-layout">

        <!-- Левое видео -->
        <div class="video-background">
            <!-- ВНИМАНИЕ: Замените ОБА текста ВАШ_ID_ВИДЕО на реальный буквенно-цифровой код Shorts -->
            <iframe src="https://youtube.com" allow="autoplay"></iframe>
        </div>

        <!-- Центральный резиновый блок -->
        <div class="container">
            <h1>NOIR CORTEGE</h1>
            <p class="subtitle">AI music crew. Straight from St. Petersburg.<br>Well-mannered, but uneducated.</p>

            <div class="links-title">Listen & Follow</div>
            <div class="social-links">
                <a href="#" target="_blank" class="social-btn"><i class="fa-solid fa-music"></i> Yandex</a>
                <a href="#" target="_blank" class="social-btn"><i class="fa-brands fa-spotify"></i> Spotify</a>
                <a href="#" target="_blank" class="social-btn"><i class="fa-brands fa-youtube"></i> YouTube</a>
                <a href="#" target="_blank" class="social-btn"><i class="fa-brands fa-tiktok"></i> Tik-Tok</a>
            </div>
        </div>

        <!-- Правое видео -->
        <div class="video-background">
            <iframe src="https://youtube.com" allow="autoplay"></iframe>
        </div>

    </div>

</body>
</html>
