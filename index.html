<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOIR CORTEGE — AI Music Crew</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0b0b0b; 
            color: #f5f5f5; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
            text-align: center;
            overflow-y: auto; 
            overflow-x: hidden;
            position: relative;
        }

        /* Шапка-баннер */
        .full-width-banner {
            width: 100%;
            height: 45vh; 
            background-image: url('./media/img/top.jpg'); /* Четкий относительный путь */
            background-size: cover;
            background-position: top center;
            border-bottom: 1px solid #1a1a1a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: block;
        }

        /* Главная трехколоночная сетка во всю ширину экрана */
        .main-layout {
            display: flex;
            justify-content: space-between; 
            align-items: flex-start;
            gap: 10px; 
            width: 100%;
            margin-top: 10px; 
            padding: 0 10px 20px 10px; 
        }

        /* Полностью резиновый центральный блок */
        .center-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px; 
            min-width: 280px;
        }

        /* Центральная карточка с информацией */
        .container {
            width: 100%;
            border: 1px solid #222;
            padding: 60px 20px; 
            background: rgba(17, 17, 17, 0.95);
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border-radius: 4px;
        }
        h1 { 
            font-size: 2.5rem; 
            letter-spacing: 6px; 
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .subtitle { 
            font-size: 1rem; 
            line-height: 1.7;
            color: #777;
            margin-bottom: 45px;
        }
        
        /* Кнопки соцсетей */
        .links-title {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-width: 140px; 
            padding: 14px 15px; 
            border: 1px solid #333;
            color: #aaa;
            text-decoration: none;
            font-size: 0.9rem; 
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        .social-btn:hover {
            border-color: #fff;
            color: #fff;
            background: #1a1a1a;
        }

        /* Блок для квадратного фото */
        .photo-block {
            width: 100%;
            border: 1px solid #222;
            background: rgba(17, 17, 17, 0.95);
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border-radius: 4px;
            overflow: hidden;
            display: flex;
        }
        .photo-block img {
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1; 
            object-fit: cover; 
        }

        /* Боковые видео фиксированной ширины */
        .video-background {
            width: 360px; 
            height: 640px; 
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            opacity: 0.4;
            transition: opacity 0.3s ease;
            flex-shrink: 0; 
        }
        .video-background:hover {
            opacity: 0.7;
        }
        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }

        @media (max-width: 1100px) {
            .video-background {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="full-width-banner"></div>

    <div class="main-layout">

        <!-- Левое видео -->
        <div class="video-background">
            <video autoplay loop muted playsinline>
                <source src="./media/video/promo_1.mp4" type="video/mp4">
            </video>
        </div>

        <div class="center-column">
            
            <!-- Блок информации -->
            <div class="container">
                <h1>NOIR CORTEGE</h1>
                <p class="subtitle">AI music crew. Straight from St. Petersburg.<br>Well-mannered, but uneducated.</p>

                <div class="links-title">Listen & Follow</div>
                <div class="social-links">
                    <a href="#" target="_blank" class="social-btn"><i class="fa-solid fa-music"></i> Yandex</a>
                    <a href="#" target="_blank" class="social-btn"><i class="fa-brands fa-spotify"></i> Spotify</a>
                    <a href="#" target="_blank" class="social-btn"><i class="fa-brands fa-youtube"></i> YouTube</a>
                    <a href="#" target="_blank" class="social-btn"><i class="fa-brands fa-tiktok"></i> Tik-Tok</a>
                </div>
            </div>

            <!-- Блок с квадратной картинкой photo_1.jpg -->
            <div class="photo-block">
                <img src="./media/img/photo_1.jpg" alt="Noir Cortege Artwork">
            </div>

        </div>

        <!-- Правое видео -->
        <div class="video-background">
            <video autoplay loop muted playsinline>
                <source src="./media/video/promo.mp4" type="video/mp4">
            </video>
        </div>

    </div>

</body>
</html>
