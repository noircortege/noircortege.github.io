<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOIR CORTEGE — AI Music Crew</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0b0b0b; 
            color: #f5f5f5; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
            text-align: center;
            overflow-y: auto; 
            overflow-x: hidden;
            position: relative;
        }

        /* Шапка-баннер */
        .full-width-banner {
            width: 100%;
            height: 45vh; 
            background-image: url('media/img/top.jpg'); /* Поменяли на top.jpg */
            background-size: cover;
            background-position: top center;
            border-bottom: 1px solid #1a1a1a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: block;
        }

        /* Главная трехколоночная сетка во всю ширину экрана */
        .main-layout {
            display: flex;
            justify-content: space-between; /* Расталкивает видео по самым краям */
            align-items: flex-start;
            gap: 10px; /* Отступ 10px между видео и информацией */
            width: 100%;
            margin-top: 10px; /* Отступ 10px от баннера сверху */
            padding: 0 10px 20px 10px; /* Отступы ровно 10px от краев экрана */
        }

        /* Полностью резиновая центральная карточка */
        .container {
            flex: 1; /* Карточка забирает ВСЁ свободное место между роликами */
            max-width: 100%; /* Убираем жесткое ограничение в 650px */
            min-width: 280px; 
            border: 1px solid #222;
            padding: 60px 20px; 
            background: rgba(17, 17, 17, 0.95);
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border-radius: 4px;
        }
        h1 { 
            font-size: 2.5rem; 
            letter-spacing: 6px; 
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .subtitle { 
            font-size: 1rem; 
            line-height: 1.7;
            color: #777;
            margin-bottom: 45px;
        }
        
        /* Кнопки соцсетей */
        .links-title {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-width: 140px; 
            padding: 14px 15px; 
            border: 1px solid #333;
            color: #aaa;
            text-decoration: none;
            font-size: 0.9rem; 
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        .social-btn:hover {
            border-color: #fff;
            color: #fff;
            background: #1a1a1a;
        }

        /* Боковые видео фиксированной ширины */
        .video-background {
            width: 360px; 
            height: 640px; 
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            opacity: 0.4;
            transition: opacity 0.3s ease;
            flex-shrink: 0; /* Ролики сохраняют свои 360px и не сжимаются */
        }
        .video-background:hover {
            opacity: 0.7;
        }

        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }

        /* Адаптивность: если экран слишком узкий (меньше 1100px), скрываем боковые видео, чтобы не ломать сайт */
        @media (max-width: 1100px) {
            .video-background {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- 1. Баннер 45vh с новой картинкой top.jpg -->
    <div class="full-width-banner"></div>

    <!-- 2. Главная ультра-широкая область -->
    <div class="main-layout">

        <!-- Левое видео (прижато к левому краю экрана на 10px) -->
        <div class="video-background">
            <video autoplay loop muted playsinline>
                <source src="media/video/promo.mp4" type="video/mp4">
                Ваш браузер не поддерживает встроенные видео.
            </video>
        </div>

        <!-- Центральный резиновый блок (растягивается от ролика до ролика) -->
        <div class="container">
            <h1>NOIR CORTEGE</h1>
            <p class="subtitle">AI music crew. Straight from St. Petersburg.<br>Well-mannered, but uneducated.</p>

            <div class="links-title">Listen & Follow</div>
            <div class="social-links">
                <a href="#" target="_blank" class="social-btn"><i class="fa-solid fa-music"></i> Yandex</a>
                <a href="#" target="_blank" class="social-btn"><i class="fa-brands fa-spotify"></i> Spotify</a>
                <a href="#" target="_blank" class="social-btn"><i class="fa-brands fa-youtube"></i> YouTube</a>
                <a href="#" target="_blank" class="social-btn"><i class="fa-brands fa-tiktok"></i> Tik-Tok</a>
            </div>
        </div>

        <!-- Правое видео (прижато к правому краю экрана на 10px) -->
        <div class="video-background">
            <video autoplay loop muted playsinline>
                <source src="media/video/promo.mp4" type="video/mp4">
                Ваш браузер не поддерживает встроенные видео.
            </video>
        </div>

    </div>

</body>
</html>
