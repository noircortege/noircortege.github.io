<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOIR CORTEGE — AI Music Crew</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0b0b0b; 
            color: #f5f5f5; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
            text-align: center;
            /* Включаем скроллинг */
            overflow-y: auto; 
            overflow-x: hidden;
            position: relative;
        }

        /* Полноэкранная шапка-баннер на самом верху */
        .full-width-banner {
            width: 100%;
            height: 45vh; /* Увеличили высоту баннера, чтобы он выглядел масштабнее */
            background-image: url('media/img/banner.jpg'); 
            background-size: cover;
            background-position: top center;
            border-bottom: 1px solid #1a1a1a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Главная трехколоночная сетка для нижней части сайта */
        .main-layout {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 40px; /* Отступы между видео и центральным блоком */
            max-width: 1400px; 
            width: 100%;
            margin-top: 40px; /* Аккуратный отступ от баннера в 45vh */
            padding: 0 30px 60px 30px; /* Отступ снизу, чтобы при скролле сайт не упирался в край экрана */
        }


        /* Увеличенная центральная карточка с информацией */
        .container {
            max-width: 650px; /* Увеличили ширину карточки (было 550px) */
            width: 100%;
            border: 1px solid #222;
            padding: 60px 40px; /* Увеличили внутренние отступы, чтобы блок стал больше */
            background: rgba(17, 17, 17, 0.95);
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border-radius: 4px;
        }
        h1 { 
            font-size: 2.8rem; /* Увеличили размер главного заголовка */
            letter-spacing: 6px; 
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .subtitle { 
            font-size: 1.1rem; /* Увеличили шрифт описания */
            line-height: 1.7;
            color: #777;
            margin-bottom: 45px;
        }
        
        /* Кнопки соцсетей */
        .links-title {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-width: 160px; /* Увеличили ширину кнопок (было 130px) */
            padding: 14px 20px; /* Сделали кнопки крупнее и объемнее */
            border: 1px solid #333;
            color: #aaa;
            text-decoration: none;
            font-size: 0.95rem; /* Слегка увеличили текст внутри кнопок */
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        .social-btn:hover {
            border-color: #fff;
            color: #fff;
            background: #1a1a1a;
        }

        /* Увеличенные боковые видео (теперь прокручиваются вместе с сайтом) */
        .video-background {
            width: 360px; /* Увеличили ширину шортсов (было 315px) */
            height: 640px; /* Увеличили высоту под стандарт 9:16 (было 560px) */
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            opacity: 0.4;
            transition: opacity 0.3s ease;
            flex-shrink: 0; /* Видео не будут сжиматься */
        }
        .video-background:hover {
            opacity: 0.7;
        }

        .video-background iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Адаптивность: плавно убираем боковые видео, если экран становится слишком узким */
        @media (max-width: 1250px) {
            .video-background {
                display: none;
            }
            .main-layout {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- 1. Масштабный баннер сверху -->
    <div class="full-width-banner"></div>

    <!-- 2. Главная рабочая область (Сетка: Видео - Контент - Видео) -->
    <div class="main-layout">

        <!-- Левое видео (Замените оба ID bssmGzicB48 на свой реальный ID) -->
        <div class="video-background">
            <iframe src="https://youtube.com" allow="autoplay"></iframe>
        </div>

        <!-- Центральный увеличенный блок информации -->
        <div class="container">
            <h1>NOIR CORTEGE</h1>
            <p class="subtitle">AI music crew. Straight from St. Petersburg.<br>Well-mannered, but uneducated.</p>

            <div class="links-title">Listen & Follow</div>
            <div class="social-links">
                <a href="#" target="_blank" class="social-btn"><i class="fa-solid fa-music"></i> Yandex</a>
                <a href="#" target="_blank" class="social-btn"><i class="fa-brands fa-spotify"></i> Spotify</a>
                <a href="#" target="_blank" class="social-btn"><i class="fa-brands fa-youtube"></i> YouTube</a>
                <a href="#" target="_blank" class="social-btn"><i class="fa-brands fa-tiktok"></i> Tik-Tok</a>
            </div>
        </div>

        <!-- Правое видео (Замените оба ID bssmGzicB48 на свой реальный ID) -->
        <div class="video-background">
            <iframe src="https://youtube.com" allow="autoplay"></iframe>
        </div>

    </div>

</body>
</html>
